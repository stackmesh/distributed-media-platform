name: stackmesh

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stackmesh
      POSTGRES_PASSWORD: stackmesh
      POSTGRES_DB: media
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-billing.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackmesh -d media"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: redpandadata/redpanda:v24.2.4
    hostname: kafka
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://kafka:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://kafka:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - kafka:33145
      - --advertise-rpc-addr
      - kafka:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=warn
    ports:
      - "19092:19092"
    volumes:
      - kafkadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  gateway:
    build: ./go-media-gateway
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://stackmesh:stackmesh@postgres:5432/media?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: stackmesh.billing.usage.v1
      BLOB_DIR: /var/lib/stackmesh/blobs
      REGION: us-east-1
      NODES: us-east-1:edge-a,us-east-1:edge-b,eu-west-1:edge-c
      MAX_OBJECT_BYTES: "67108864"
      OUTBOX_INTERVAL: 500ms
    volumes:
      - blobs:/var/lib/stackmesh/blobs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  billing:
    build: ./java-billing-engine
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/billing
      SPRING_DATASOURCE_USERNAME: stackmesh
      SPRING_DATASOURCE_PASSWORD: stackmesh
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BILLING_TOPIC: stackmesh.billing.usage.v1
      STACKMESH_API_KEY: sandbox-key
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  pgdata:
  kafkadata:
  blobs:
